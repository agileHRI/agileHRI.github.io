# Home page. Edited with Pages CMS (see .pages.yml) or by hand.
hero:
  tag: AgileHRI · Global HRI Ecosystem
  title: Connecting European HRI Innovations towards a global, lasting ecosystem
  titleStyle: subtitle
  text: AgileHRI connects structured knowledge, persistent communities and reusable technical assets so that HRI results survive individual projects and generate new collaboration.
  button:
    label: Join ARISE on Discord
    url: https://discord.gg/8UdphaTh
cycle:
  tag: From funded project to sustainable ecosystem
  steps:
    - label: Challenge
      text: Industrial HRI barrier identified & scoped by TEFs, DIHs, sector operators
    - label: TEF/DIH Experiment
      text: Shared facility exploration & testing at TRL 6–7
    - label: HRI Module
      text: Skill or capability developed, integrated & validated
    - label: Validation
      text: PoC/MVP validated; industrial use case documented & measured
    - label: Reusable Asset
      text: Open resource ready for replication by any DIH, TEF or SME
  loop:
    label: New Challenge
    text: Assets and relationships seed new projects
  note: "You can enter this cycle at any step: propose a challenge, reuse a module, or validate at a TEF"
stats:
  - number: "13"
